name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3 libncurses-dev
      - name: Init submodules
        run: |
          git submodule update --init
          git submodule update --init --recursive third_party/imtui
      - name: Configure
        run: cmake --preset with-tests
      - name: Build
        run: cmake --build --preset with-tests -j$(nproc)
      - name: Test
        run: ctest --preset default
