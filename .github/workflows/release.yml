name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git submodule update --init
          git submodule update --init --recursive third_party/imtui
      - run: cmake -B build
      - run: make -C build -j$(sysctl -n hw.ncpu)
      - run: chmod +x build/midle
      - uses: actions/upload-artifact@v4
        with:
          name: midle-macos-arm64
          path: build/midle

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
      - run: |
          git submodule update --init
          git submodule update --init --recursive third_party/imtui third_party/pdcurses
      - run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32 \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
      - run: make -C build -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: midle-windows-x64
          path: build/midle.exe

  linux-musl:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20
      options: --user root
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@v4
      - run: |
          apk add --no-cache \
            cmake \
            make \
            g++ \
            python3 \
            ncurses-dev
      - run: git config --global safe.directory '*'
      - run: |
          git submodule update --init
          git submodule update --init --recursive third_party/imtui
      - run: cmake -B build
      - run: make -C build -j$(nproc)
      - run: chmod +x build/midle
      - uses: actions/upload-artifact@v4
        with:
          name: midle-linux-musl-x64
          path: build/midle

  release:
    needs: [macos, windows, linux-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            midle-macos-arm64/midle
            midle-windows-x64/midle.exe
            midle-linux-musl-x64/midle
