name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git submodule update --init
          git submodule update --init --recursive third_party/imtui
      - run: cmake --preset default
      - run: cmake --build --preset default -j$(sysctl -n hw.ncpu)
      - run: cp build/midle midle-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: midle-macos-arm64
          path: midle-macos-arm64

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
      - run: |
          git submodule update --init
          git submodule update --init --recursive third_party/imtui third_party/pdcurses
      - run: cmake --preset windows-cross
      - run: cmake --build --preset windows-cross -j$(nproc)
      - run: cp build-windows/midle.exe midle-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: midle-windows-x64
          path: midle-windows-x64.exe

  linux:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20
      options: --user root
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@v4
      - run: |
          apk add --no-cache \
            cmake \
            make \
            g++ \
            python3 \
            ncurses-dev \
            ncurses-static
      - run: git config --global safe.directory '*'
      - run: |
          rm -f /usr/lib/libncurses.so /usr/lib/libncursesw.so \
                /usr/lib/libtinfo.so /usr/lib/libtinfow.so \
                /usr/lib/libform.so /usr/lib/libformw.so \
                /usr/lib/libpanel.so /usr/lib/libpanelw.so \
                /usr/lib/libmenu.so /usr/lib/libmenuw.so
          git submodule update --init
          git submodule update --init --recursive third_party/imtui
      - run: cmake --preset linux-static
      - run: cmake --build --preset linux-static -j$(nproc)
      - run: cp build-static/midle midle-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: midle-linux-x64
          path: midle-linux-x64

  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            midle-macos-arm64/midle-macos-arm64
            midle-windows-x64/midle-windows-x64.exe
            midle-linux-x64/midle-linux-x64
